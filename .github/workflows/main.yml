name: Build debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build
        working-directory: android
        run: |
          set +e
          gradle assembleDebug --dependency-verification=off --console=plain > build.log 2>&1
          code=$?
          echo "=== WHAT WENT WRONG ==="
          grep -n -A12 "What went wrong" build.log || true
          echo "=== KOTLIN ERRORS ==="
          grep -n "^e: " build.log | head -30 || true
          exit $code

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android/build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: docuflex-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
