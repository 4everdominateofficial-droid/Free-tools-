name: Build debug APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Apply build fixes
        run: |
          python3 - <<'PYEND'
          import re, pathlib
          A = pathlib.Path("android")

          def rd(p): return (A / p).read_text()
          def wr(p, s): (A / p).write_text(s)
          def edit(p, fn):
              s = rd(p); n = fn(s)
              if n != s: wr(p, n)

          def ins_after(s, anchor, text):
              i = s.index(anchor) + len(anchor)
              return s[:i] + "\n" + text + s[i:]

          # settings: plugin + dependency repositories
          def settings(s):
              if "pluginManagement" in s: return s
              head = ('pluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}\n\n'
                      'dependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\n\n')
              return head + s
          edit("settings.gradle.kts", settings)

          # version catalog: add only missing keys
          def toml(s):
              add = {
                "[versions]": [("ksp", 'ksp = "1.9.23-1.0.20"'), ("fragment", 'fragment = "1.7.1"')],
                "[libraries]": [
                  ("androidx-lifecycle-viewmodel-ktx", 'androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycleRuntimeKtx" }'),
                  ("androidx-lifecycle-viewmodel-compose", 'androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }'),
                  ("androidx-lifecycle-viewmodel-savedstate", 'androidx-lifecycle-viewmodel-savedstate = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-savedstate", version.ref = "lifecycleRuntimeKtx" }'),
                  ("androidx-lifecycle-runtime-compose", 'androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }'),
                  ("androidx-fragment-ktx", 'androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }')],
                "[plugins]": [("ksp", 'ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }')],
              }
              for sec, items in add.items():
                  for key, line in items:
                      i = s.index(sec) + len(sec)
                      j = s.find("\n[", i)
                      body = s[i:] if j < 0 else s[i:j]
                      if not re.search(r"^" + re.escape(key) + r"\s*=", body, re.M):
                          s = ins_after(s, sec, line)
              return s
          edit("gradle/libs.versions.toml", toml)

          edit("build.gradle.kts", lambda s: s if "libs.plugins.ksp" in s else ins_after(s, "alias(libs.plugins.kotlin.android) apply false", "    alias(libs.plugins.ksp) apply false"))

          def data(s):
              if "libs.plugins.ksp" not in s: s = ins_after(s, "alias(libs.plugins.kotlin.android)", "    alias(libs.plugins.ksp)")
              if "ksp(" not in s: s = ins_after(s, "dependencies {", "    ksp(libs.androidx.room.compiler)")
              return s
          edit("core/data/build.gradle.kts", data)

          def app(s):
              s = s.replace("java.util.Properties()", "Properties()")
              if "import java.util.Properties" not in s: s = "import java.util.Properties\n\n" + s
              return s
          edit("app/build.gradle.kts", app)

          for m in ["core/model", "core/security", "core/theme", "core/viewer", "core/data"] + ["feature/" + f for f in ["home", "recents", "favorites", "viewer", "settings", "legal"]]:
              edit(m + "/build.gradle.kts", lambda s: s.replace("compileSdk = 34", "compileSdk = 35"))

          FEATURE_DEPS = [
           'implementation(project(":core:model"))', 'implementation(project(":core:security"))', 'implementation(project(":core:data"))',
           'implementation(project(":core:viewer"))', 'implementation(project(":core:theme"))',
           'implementation(libs.androidx.core.ktx)', 'implementation(libs.androidx.lifecycle.runtime.ktx)',
           'implementation(libs.androidx.lifecycle.viewmodel.ktx)', 'implementation(libs.androidx.lifecycle.viewmodel.compose)',
           'implementation(libs.androidx.lifecycle.viewmodel.savedstate)', 'implementation(libs.androidx.lifecycle.runtime.compose)',
           'implementation(libs.androidx.activity.compose)', 'implementation(libs.kotlinx.coroutines.android)',
           'implementation(platform(libs.androidx.compose.bom))', 'implementation(libs.androidx.ui)', 'implementation(libs.androidx.ui.graphics)',
           'implementation(libs.androidx.material3)', 'implementation(libs.androidx.material3.windowsizeclass)',
           'implementation(libs.androidx.material.icons.extended)', 'implementation(libs.androidx.navigation.compose)']
          def feature(s):
              if "compose = true" not in s:
                  s = ins_after(s, "android {", '    buildFeatures {\n        compose = true\n    }\n    composeOptions {\n        kotlinCompilerExtensionVersion = "1.5.11"\n    }')
              for d in FEATURE_DEPS:
                  if d not in s: s = ins_after(s, "dependencies {", "    " + d)
              return s
          for f in ["home", "recents", "favorites", "viewer", "settings", "legal"]:
              edit("feature/" + f + "/build.gradle.kts", feature)

          def need(path, dep):
              edit(path, lambda s: s if dep in s else ins_after(s, "dependencies {", "    " + dep))
          need("core/viewer/build.gradle.kts", "testImplementation(libs.junit)")
          need("core/security/build.gradle.kts", "implementation(libs.androidx.fragment.ktx)")

          p = A / "gradle.properties"
          if "suppressUnsupportedCompileSdk" not in p.read_text():
              p.write_text(p.read_text().rstrip("\n") + "\nandroid.suppressUnsupportedCompileSdk=35\n")

          edit("app/src/main/AndroidManifest.xml", lambda s: "".join(l for l in s.splitlines(True) if "category.BROWSABLE" not in l))

          V = "core/viewer/src/main/kotlin/com/docuflex/core/viewer/"
          edit(V + "SafeHtmlEngine.kt", lambda s: s.replace("javascriptUrlPattern.replaceAll(", "javascriptUrlPattern.matcher(content).replaceAll("))

          def img(s):
              s = s.replace("(halfWidth / inSampleSize) >= maxTargetDimension", "(origWidth / inSampleSize) > maxTargetDimension")
              return s.replace("(halfHeight / inSampleSize) >= maxTargetDimension", "(origHeight / inSampleSize) > maxTargetDimension")
          edit(V + "ImageEngine.kt", img)

          M = "app/src/main/kotlin/com/docuflex/app/MainActivity.kt"
          def main(s):
              s = s.replace("androidx.lifecycle.lifecycleScope.launch", "lifecycleScope.launch")
              if "import androidx.lifecycle.lifecycleScope" not in s:
                  s = s.replace("import androidx.activity.viewModels\n", "import androidx.activity.viewModels\nimport androidx.lifecycle.lifecycleScope\n", 1)
              return s
          edit(M, main)

          VW = "feature/viewer/src/main/kotlin/com/docuflex/feature/viewer/"
          wr(VW + "ZoomableImage.kt", '''package com.docuflex.feature.viewer

          import android.graphics.Bitmap
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.gestures.detectTransformGestures
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableFloatStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.compose.ui.graphics.graphicsLayer
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.layout.ContentScale

          @Composable
          fun ZoomableImage(bitmap: Bitmap) {
              var scale by remember { mutableFloatStateOf(1f) }
              var offsetX by remember { mutableFloatStateOf(0f) }
              var offsetY by remember { mutableFloatStateOf(0f) }
              Image(
                  bitmap = bitmap.asImageBitmap(),
                  contentDescription = "Document image preview",
                  contentScale = ContentScale.Fit,
                  modifier = Modifier
                      .fillMaxSize()
                      .pointerInput(Unit) {
                          detectTransformGestures { _, pan, zoom, _ ->
                              scale = (scale * zoom).coerceIn(1f, 6f)
                              if (scale <= 1f) {
                                  offsetX = 0f
                                  offsetY = 0f
                              } else {
                                  offsetX += pan.x
                                  offsetY += pan.y
                              }
                          }
                      }
                      .graphicsLayer(scaleX = scale, scaleY = scale, translationX = offsetX, translationY = offsetY)
              )
          }
          ''')
          def screen(s):
              pat = re.compile(r"Image\(\s*bitmap = state\.bitmap\.asImageBitmap\(\),.*?contentScale = ContentScale\.Fit\s*\)", re.S)
              return pat.sub("ZoomableImage(state.bitmap)", s, count=1)
          edit(VW + "DocumentViewerScreen.kt", screen)
          print("All fixes applied")
          PYEND

      - name: Build
        working-directory: android
        run: |
          set +e
          gradle assembleDebug --dependency-verification=off --console=plain > build.log 2>&1
          code=$?
          echo "=== WHAT WENT WRONG ==="
          grep -n -A8 "What went wrong" build.log | head -40 || true
          echo "=== KOTLIN ERRORS ==="
          grep -n "^e: " build.log | sed 's#file:///home/runner/work/[^/]*/[^/]*/android/##' | head -80 || true
          exit $code

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android/build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: docuflex-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
